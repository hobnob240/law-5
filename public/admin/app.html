<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">

<script src="/admin/app.js?v=2" type="module"></script>

<body>
<div class="app">
  <header class="top">
    <div class="top-row">
      <div class="mark">Law <b>&amp;</b> Son</div>
      <div class="grow"></div>
      <a class="view" href="/" target="_blank" rel="noopener">View website</a>
